# Bingo Event Configuration

# Maximum players in the event
max-players: 15

# Round duration in minutes
round-duration-minutes: 15

# Countdown duration in seconds before start
countdown-seconds: 15

# Warning interval for out-of-zone players (in seconds)
zone-warning-interval: 1

# Grace period before teleporting player back to zone (in seconds)
zone-grace-period: 20

# Prize places count
prize-places: 3

